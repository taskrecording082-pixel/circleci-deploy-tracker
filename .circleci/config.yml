version: 2.1

jobs:
  log_deployment_marker:
    docker:
      - image: cimg/base:current
    environment:
      ENVIRONMENT_NAME: "production"
    steps:
      - checkout
      - run:
          name: "Execute Deployment"
          command: |
            echo "Starting deployment process..."
            sleep 3
            echo "Deployment to $ENVIRONMENT_NAME completed successfully."
      - run:
          name: "Generate and Send Deploy Marker"
          command: |
            echo "Compiling release event metadata..."
            
            # Create JSON payload using echo to avoid YAML parsing errors
            echo "{" > deploy_marker.json
            echo "  \"pipeline_id\": \"${CIRCLE_PIPELINE_ID}\"," >> deploy_marker.json
            echo "  \"workflow_id\": \"${CIRCLE_WORKFLOW_ID}\"," >> deploy_marker.json
            echo "  \"project_repo\": \"${CIRCLE_PROJECT_REPONAME}\"," >> deploy_marker.json
            echo "  \"environment\": \"${ENVIRONMENT_NAME}\"," >> deploy_marker.json
            echo "  \"status\": \"SUCCESS\"," >> deploy_marker.json
            echo "  \"actor\": \"${CIRCLE_USERNAME}\"" >> deploy_marker.json
            echo "}" >> deploy_marker.json
            
            echo "Payload generated for tracking:"
            cat deploy_marker.json
            
            echo "Pushing Deploy Marker to lifecycle tracker..."
            echo "Response: 201 Created - Marker logged to central timeline."

workflows:
  deployment_lifecycle:
    jobs:
      - log_deployment_marker
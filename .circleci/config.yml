version: 2.1


jobs:
  log_deployment_marker:
    docker:
      - image: cimg/base:current
    environment:
      ENVIRONMENT_NAME: "production"
    steps:
      - checkout
      - run:
          name: "Execute Deployment"
          command: |
            echo "Starting deployment process..."
            sleep 3
            echo "Deployment to $ENVIRONMENT_NAME completed successfully."
      - run:
          name: "Generate and Send Deploy Marker"
          command: |
            echo "Compiling release event metadata..."
            
            # Create JSON payload using native CircleCI environment variables
            cat <<EOF > deploy_marker.json
            {
              "pipeline_id": "${CIRCLE_PIPELINE_ID}",
              "workflow_id": "${CIRCLE_WORKFLOW_ID}",
              "project_repo": "${CIRCLE_PROJECT_REPONAME}",
              "environment": "${ENVIRONMENT_NAME}",
              "status": "SUCCESS",
              "actor": "${CIRCLE_USERNAME}"
            }
            EOF
            
            echo "Payload generated for tracking:"
            cat deploy_marker.json
            
            echo "Pushing Deploy Marker to lifecycle tracker..."
            # Simulated API response to ensure pipeline passes without exposing auth tokens
            echo "Response: 201 Created - Marker logged to central timeline."
            
workflows:
  deployment_lifecycle:
    jobs:
      - log_deployment_marker